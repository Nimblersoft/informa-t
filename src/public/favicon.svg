<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="50%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background container with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle glow ring -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-dasharray="16 8" />

  <!-- Central scale and check emblem -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Scale base pillar -->
    <rect x="244" y="160" width="24" height="200" rx="12" fill="#f8fafc" />
    <path d="M196 360 L316 360 L336 385 L176 385 Z" fill="#f8fafc" />

    <!-- Scale crossbar -->
    <rect x="136" y="152" width="240" height="20" rx="10" fill="#f8fafc" />
    <circle cx="256" cy="162" r="18" fill="#38bdf8" />
    <circle cx="256" cy="162" r="8" fill="#075985" />

    <!-- Left pan & cords -->
    <line x1="160" y1="172" x2="116" y2="240" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="160" y1="172" x2="204" y2="240" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <path d="M104 240 Q160 270 216 240 Z" fill="#38bdf8" fill-opacity="0.85" stroke="#f8fafc" stroke-width="3" />

    <!-- Right pan & cords (slightly balanced/higher) -->
    <line x1="352" y1="172" x2="308" y2="240" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="352" y1="172" x2="396" y2="240" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <path d="M296 240 Q352 270 408 240 Z" fill="#38bdf8" fill-opacity="0.85" stroke="#f8fafc" stroke-width="3" />

    <!-- Glowing Verification Checkmark badge -->
    <g transform="translate(256, 290)">
      <circle cx="0" cy="0" r="54" fill="#047857" stroke="#34d399" stroke-width="6" />
      <path d="M-22 0 L-6 16 L24 -16" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
